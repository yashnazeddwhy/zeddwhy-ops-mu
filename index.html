<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#05122b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ZeddWhy">
<title>ZeddWhy Interactive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --navy:#05122b;--navy2:#0b2250;--blue:#1f6fe5;--blue-d:#1658bd;--cyan:#1fb6e8;
  --bg:#eef3fa;--card:#ffffff;--ink:#0e1b33;--muted:#62708a;--line:#e1e8f3;
  --ok:#13805b;--okbg:#e2f6ee;--warn:#9a5a06;--warnbg:#fff1dc;--bad:#c4264a;--badbg:#fde6ec;--info:#1f6fe5;--infobg:#e6efff;--mute:#51607a;--mutebg:#edf1f7;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.num{font-family:Manrope,Inter,system-ui,sans-serif;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin:12px 0 4px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg{flex:none}

/* buttons + badges */
.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--blue);color:#fff;font-weight:600;cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn:hover{background:var(--blue-d)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--mutebg)}
.btn.danger{background:#fff;color:var(--bad);border:1px solid var(--line)}
.btn.small{padding:7px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.6}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-bad{background:var(--badbg);color:var(--bad)}.b-info{background:var(--infobg);color:var(--info)}.b-mute{background:var(--mutebg);color:var(--mute)}

/* shell */
#side{display:none}
#top{position:sticky;top:0;z-index:6;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px}
#top .topLogo{height:52px;width:auto;margin:-4px 0}
.search{display:none}
.avatar{width:38px;height:38px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;font:700 14px Manrope,sans-serif;cursor:pointer}
main{max-width:1120px;margin:0 auto;padding:16px 16px calc(92px + env(safe-area-inset-bottom,0px))}
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabbar button{background:none;border:0;padding:9px 2px 8px;color:var(--muted);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
#tabbar button.on{color:var(--blue)}
.logo{display:block;-webkit-mask-image:radial-gradient(ellipse 62% 66% at 50% 50%,#000 52%,transparent 98%);mask-image:radial-gradient(ellipse 62% 66% at 50% 50%,#000 52%,transparent 98%)}

/* content */
.only-d,.pagehead.only-d{display:none}
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:4px 0 14px;flex-wrap:wrap}
.pagehead h2{font-size:24px;font-weight:800}
.pagehead p{margin:2px 0 0;color:var(--muted)}
.hello{font:800 24px Manrope,sans-serif;margin:6px 0 2px}
.chip{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:500;color:var(--mute);white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
button.card{display:block;width:100%;text-align:left;cursor:pointer}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.panel h3{font-size:16px;font-weight:800;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.panel h3 a{font:600 13px Inter,sans-serif;color:var(--blue);text-decoration:none;cursor:pointer}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;display:block;width:100%}
.stat .num{font-size:30px;font-weight:800;display:block;line-height:1.1;margin-top:10px}
.stat small{color:var(--muted);font-size:13px}
.ico{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--tb,#e6efff);color:var(--tc,#1f6fe5)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.tile{background:var(--tb);color:var(--tc);border:0;border-radius:var(--r);padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer;text-align:center}
.tile span{color:var(--ink)}
.strip{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.strip div{background:var(--navy2);color:#dbe7ff;border-radius:var(--r);padding:12px 14px}
.strip small{display:block;opacity:.75;font-size:12px}
.strip strong{font:800 18px Manrope,sans-serif;color:#fff}
.cols{display:block}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.item{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .grow{flex:1;min-width:0}
.item b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-size:13px}
.ava{width:36px;height:36px;border-radius:50%;background:var(--infobg);color:var(--blue);display:grid;place-items:center;font:700 13px Manrope,sans-serif;flex:none}
.amt{font-weight:600;white-space:nowrap}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa button{background:var(--tb);color:var(--tc);border:0;border-radius:12px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer}
.qa button span{color:var(--ink)}
.empty{color:var(--muted);text-align:center;padding:22px 8px}
.pad{padding:24px 0;text-align:center}
.muted{color:var(--muted)}
.monthbar{margin-bottom:12px;max-width:260px}
.monthbar label,.filter label{margin-top:0}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.sum small{display:block;color:var(--muted);font-size:12px}
.sum strong{font:800 19px Manrope,sans-serif}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
th{font-size:12px;color:var(--muted);font-weight:600}
tfoot td{font-weight:700;border-bottom:0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar .btn{flex:0 0 auto}

/* sheet */
#sheet{position:fixed;inset:0;background:rgba(5,18,43,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
#sheet.open{display:flex}
#sheetBox{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
#sheetBox h3{font-size:20px;font-weight:800;margin-bottom:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.actions .btn{flex:1}
.net{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);margin-top:16px;padding-top:10px;font:800 22px Manrope,sans-serif}
.note{font-size:13px;color:var(--muted);margin-top:10px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:30;max-width:90%;text-align:center}
#toast.bad{background:var(--bad)}

/* login */
#loginView{min-height:100vh;background:radial-gradient(120% 70% at 50% 0%,#0d2c66 0%,var(--navy) 60%);color:#fff;display:none}
.login{max-width:400px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top,0px)) 20px 40px;text-align:center}
.login .logo{width:100%;max-width:340px;margin:0 auto 6px}
.login h1{font-size:26px;font-weight:800;margin-top:8px}
.login p{color:#a8bde3;margin:6px 0 20px}
.field{position:relative;margin-bottom:12px;text-align:left}
.field svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#6f8190}
.field input{padding-left:44px;height:50px;border:0;border-radius:12px;color:#0e1b33}
.login .btn{width:100%;height:50px;font-size:16px;margin-top:6px}
.show{display:flex;gap:8px;align-items:center;color:#a8bde3;font-size:14px;margin:4px 0 0;text-align:left}
.show input{width:auto}
.err{color:#ff9db1;margin-top:12px;min-height:20px}

@media (min-width:900px){
  body{font-size:15px}
  #side{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:248px;background:var(--navy);color:#cfdcf5;padding:16px 12px;z-index:7}
  #side .logo{width:100%;margin:0 0 10px}
  #side nav{display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1}
  #side nav button{background:none;border:0;display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:10px;color:#b9c9e8;font-weight:500;cursor:pointer;text-align:left}
  #side nav button:hover{background:rgba(255,255,255,.07)}
  #side nav button.on{background:var(--blue);color:#fff}
  #side .ver{font-size:12px;opacity:.5;text-align:center;padding-top:8px}
  #content{margin-left:248px}
  #top{background:#fff;color:var(--ink);border-bottom:1px solid var(--line);padding:12px 28px}
  #top .topLogo{display:none}
  .search{display:block;flex:1;max-width:520px}
  .search input{background:var(--bg);border:0;height:42px;border-radius:10px}
  #top .right{display:flex;align-items:center;gap:12px}
  main{padding:26px 28px 40px}
  #tabbar,.only-m{display:none!important}
  .only-d{display:block}
  .pagehead.only-d{display:flex}
  .stats{grid-template-columns:repeat(4,1fr)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .strip{grid-template-columns:repeat(3,1fr)}
  #toast{bottom:28px}
  #sheet{align-items:center}
  #sheetBox{border-radius:18px;max-height:88%}
}
@media (prefers-reduced-motion:no-preference){#sheetBox{animation:up .18s ease-out}@keyframes up{from{transform:translateY(20px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>

const dnum = x => { const [y, m, d] = x.split('-').map(Number); return Date.UTC(y, m - 1, d) / 86400000; };
const daysBetween = (a, b) => dnum(b) - dnum(a) + 1;
const overlap = (as, ae, ms, me) => { const s = as > ms ? as : ms, e = ae < me ? ae : me; return s <= e ? daysBetween(s, e) : 0; };
const minsBetween = (a, b) => { if (!a || !b) return 0; const p = t => { const [h, m] = t.split(':'); return +h * 60 + +m; }; const d = p(b) - p(a); return d > 0 ? d : 0; };
const sum = (arr, k) => r2(arr.reduce((t, x) => t + num(x[k]), 0));
const initials = n => String(n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const lab = s => String(s || '').replace('_', ' ').replace(/^./, c => c.toUpperCase());

const badge = (t, k) => `<span class="badge b-${STATUS_CLS[k || t] || 'mute'}">${esc(lab(t))}</span>`;

const dispName = () => { try { return localStorage.getItem('zw_name') || ''; } catch (e) { return ''; } };

/* ---------- statutory rates ---------- */
const DEFAULT_RATES = { csgLow: 1.5, csgHigh: 3, csgThreshold: 50000, nsfRate: 1, nsfCap: 29710 };
function loadRates() { try { return {...DEFAULT_RATES, ...JSON.parse(localStorage.getItem('zw_rates') || '{}')}; } catch (e) { return {...DEFAULT_RATES}; } }
let RATES = loadRates();
function statutory(gross) {
  const csg = gross >= RATES.csgThreshold ? gross * RATES.csgHigh / 100 : gross * RATES.csgLow / 100;
  const nsf = Math.min(gross, RATES.nsfCap) * RATES.nsfRate / 100;
  return { csg: r2(csg), nsf: r2(nsf) };
}
function openRates() {
  openSheet(`<h3>Statutory rates</h3>
  <p class="note">Used to pre-fill CSG and NSF on payslips. Check them against the MRA website before paying anyone. They are saved on this device only, so your partner sets them on theirs.</p>
  <form onsubmit="saveRates(event)">
    <div class="two"><div><label>CSG % below threshold</label><input name="csgLow" type="number" step="0.01" value="${RATES.csgLow}"></div>
    <div><label>CSG % at or above</label><input name="csgHigh" type="number" step="0.01" value="${RATES.csgHigh}"></div></div>
    <label>CSG threshold (Rs per month)</label><input name="csgThreshold" type="number" step="1" value="${RATES.csgThreshold}">
    <div class="two"><div><label>NSF %</label><input name="nsfRate" type="number" step="0.01" value="${RATES.nsfRate}"></div>
    <div><label>NSF wage ceiling (Rs)</label><input name="nsfCap" type="number" step="1" value="${RATES.nsfCap}"></div></div>
    <p class="note">PAYE is entered by hand on each payslip, because it depends on each person's declared reliefs.</p>
    <div class="actions"><button type="button" class="btn ghost" onclick="closeSheet()">Cancel</button><button class="btn">Save rates</button></div>
  </form>`);
}
function saveRates(e) {
  e.preventDefault(); const f = new FormData(e.target);
  RATES = { csgLow: num(f.get('csgLow')), csgHigh: num(f.get('csgHigh')), csgThreshold: num(f.get('csgThreshold')), nsfRate: num(f.get('nsfRate')), nsfCap: num(f.get('nsfCap')) };
  try { localStorage.setItem('zw_rates', JSON.stringify(RATES)); } catch (err) {}
  closeSheet(); toast('Rates saved');
}

  return `${pageHead('Contracts', plusBtn('New contract', "contractForm('')"), soon ? `${soon} expiring within 30 days` : '')}
  ${list.length ? list.map(c => { const st = cStatus(c);
    return `<div class="card"><div class="item" style="padding:0;border:0"><span class="ico" style="--tb:#eae7fb;--tc:#5a4cc4">${ic('file', 20)}</span><div class="grow"><b>${esc(c.title)}</b><span class="sub">${esc(agentName(c.agent_id))}${c.contract_type ? ' · ' + esc(c.contract_type) : ''}</span><span class="sub">${c.start_date ? fdate(c.start_date) : 'No start date'}${c.end_date ? ' – ' + fdate(c.end_date) : ' – open ended'}</span></div>${badge(st)}</div>
    <div class="actions" style="margin-top:10px">${c.file_path ? `<button class="btn ghost small" onclick="openFile('${c.file_path.replace(/'/g, "\\'")}')">Open file</button>` : ''}<button class="btn ghost small" onclick="contractForm('${c.id}')">Edit</button><button class="btn danger small" onclick="delContract('${c.id}')">Delete</button></div></div>`; }).join('')
  : '<p class="empty">No contracts yet. Create the first one and attach the signed copy.</p>'}`;
}
function contractForm(id) {
  if (!S.agents.length) return toast('Add an agent first', true);
  const c = S.contracts.find(x => x.id === id) || { status: 'active', contract_type: CONTRACT_TYPES[0], start_date: today() };
  openSheet(`<h3>${id ? 'Edit contract' : 'New contract'}</h3>
  <form onsubmit="saveContract(event,'${id}')">
    <label>Agent</label><select name="agent_id" required>${agentOpts(c.agent_id)}</select>
    ${fld('title', 'Title', c.title, 'text', 'required placeholder="e.g. Commission agreement 2026"')}
    <div class="two"><div><label>Type</label><select name="contract_type">${opts(CONTRACT_TYPES, c.contract_type)}</select></div>
    <div><label>Status</label><select name="status">${['active', 'draft', 'terminated'].map(s => `<option value="${s}" ${c.status === s ? 'selected' : ''}>${lab(s)}</option>`).join('')}</select></div></div>
    <div class="two"><div>${fld('start_date', 'Start date', c.start_date, 'date')}</div><div>${fld('end_date', 'End date', c.end_date, 'date')}</div></div>
    <label>Signed copy ${c.file_name ? '(replace: ' + esc(c.file_name) + ')' : '(optional)'}</label><input name="file" type="file">
    <label>Notes</label><textarea name="notes">${esc(c.notes || '')}</textarea>
    <div class="actions"><button type="button" class="btn ghost" onclick="closeSheet()">Cancel</button><button class="btn" id="cBtn">Save contract</button></div>
  </form>`);
}
async function saveContract(e, id) {
  e.preventDefault(); const f = e.target, btn = $('#cBtn'); btn.disabled = true; btn.textContent = 'Saving…';
  const old = S.contracts.find(x => x.id === id), file = f.file.files[0];
  const row = { agent_id: f.agent_id.value, title: f.title.value.trim(), contract_type: f.contract_type.value, status: f.status.value, start_date: f.start_date.value || null, end_date: f.end_date.value || null, notes: f.notes.value.trim() || null };
  const fail = m => { btn.disabled = false; btn.textContent = 'Save contract'; toast(m, true); };
  if (file) {
    const path = `contracts/${row.agent_id}/${Date.now()}-${safeName(file.name)}`;
    const up = await db.storage.from('documents').upload(path, file, { contentType: file.type || undefined });
    if (up.error) return fail(up.error.message);
    row.file_path = path; row.file_name = file.name;
  }
  const r = id ? await db.from('contracts').update(row).eq('id', id) : await db.from('contracts').insert(row);
  if (r.error) { if (row.file_path) await db.storage.from('documents').remove([row.file_path]); return fail(r.error.message); }
  if (file && old && old.file_path) await db.storage.from('documents').remove([old.file_path]);
  closeSheet(); toast('Contract saved'); go(S.view, true);
}
async function delContract(id) {
  if (!confirm('Delete this contract and its file?')) return;
  const c = S.contracts.find(x => x.id === id);
  if (c.file_path) await db.storage.from('documents').remove([c.file_path]);
  const r = await db.from('contracts').delete().eq('id', id);
  if (r.error) return toast(r.error.message, true); toast('Contract deleted'); go('contracts', true);
}

/* ---------- reports ---------- */
function reportRows() {
  const m1 = monthStart(S.month), m2 = lastDay(S.month);
  return S.agents.filter(a => a.status === 'active' || S.sales.some(s => s.agent_id === a.id) || S.payslips.some(p => p.agent_id === a.id)).map(a => {
    const sales = S.sales.filter(s => s.agent_id === a.id), p = S.payslips.find(x => x.agent_id === a.id), att = S.att.filter(r => r.agent_id === a.id);
    const days = att.reduce((t, r) => t + (r.status === 'present' || r.status === 'late' ? 1 : r.status === 'half_day' ? .5 : 0), 0);
    const mins = att.reduce((t, r) => t + minsBetween(r.time_in, r.time_out), 0);
    const off = k => S.abs.filter(x => x.agent_id === a.id && x.kind === k).reduce((t, x) => t + overlap(x.start_date, x.end_date, m1, m2), 0);
    return { name: a.full_name, sales: sum(sales, 'sale_amount'), commission: sum(sales, 'commission_amount'), net: p ? num(p.net_pay) : 0, days, hours: mins / 60, leave: off('leave'), sick: off('sickness') };
  });
}
function vReports() {
  const rows = reportRows(), T = k => rows.reduce((t, r) => t + r[k], 0);
  return `${pageHead('Reports', `<button class="btn" onclick="exportReport()">Download CSV</button>`, 'Monthly summary per agent')}${monthBar()}
  ${rows.length ? `<div class="tablewrap"><table><thead><tr><th>Agent</th><th>Sales</th><th>Commission</th><th>Net pay</th><th>Days</th><th>Hours</th><th>Leave</th><th>Sick</th></tr></thead><tbody>
  ${rows.map(r => `<tr><td>${esc(r.name)}</td><td>${rs(r.sales)}</td><td>${rs(r.commission)}</td><td>${r.net ? rs(r.net) : '–'}</td><td>${r.days}</td><td>${r.hours.toFixed(1)}</td><td>${r.leave}</td><td>${r.sick}</td></tr>`).join('')}</tbody>
  <tfoot><tr><td>Total</td><td>${rs(T('sales'))}</td><td>${rs(T('commission'))}</td><td>${rs(T('net'))}</td><td>${T('days')}</td><td>${T('hours').toFixed(1)}</td><td>${T('leave')}</td><td>${T('sick')}</td></tr></tfoot></table></div>
  <p class="note">Days counts present and late as 1 and half days as 0.5. Leave and sick count approved days that fall in the month.</p>` : '<p class="empty">No data for this month yet.</p>'}`;
}
function toCSV(rows) { return rows.map(r => r.map(v => { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',')).join('\n'); }
function exportReport() {
  const rows = [['Agent', 'Sales', 'Commission', 'Net pay', 'Days present', 'Hours', 'Leave days', 'Sick days'], ...reportRows().map(r => [r.name, r.sales, r.commission, r.net, r.days, r.hours.toFixed(1), r.leave, r.sick])];
  const b = new Blob(['\ufeff' + toCSV(rows)], { type: 'text/csv;charset=utf-8' }), u = URL.createObjectURL(b), a = document.createElement('a');
  a.href = u; a.download = `zeddwhy-report-${S.month}.csv`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000);
}

/* ---------- settings ---------- */
function vSettings() {
  return `${pageHead('Settings')}
  <div class="card"><h3 style="font-size:16px">Account</h3><p class="sub" style="margin:6px 0 12px">${esc(S.user ? S.user.email : '')}</p>
    <label style="margin-top:0">Your name (shown in the greeting)</label><input value="${esc(dispName())}" oninput="setName(this.value)" placeholder="e.g. Yashna">
    <div class="actions"><button class="btn ghost" onclick="signOut()">${ic('logout', 18)} Sign out</button></div></div>
  <div class="card"><h3 style="font-size:16px">Statutory rates</h3><p class="sub" style="margin:6px 0 12px">CSG ${RATES.csgLow}% / ${RATES.csgHigh}% (threshold Rs ${RATES.csgThreshold.toLocaleString('en-US')}), NSF ${RATES.nsfRate}% up to Rs ${RATES.nsfCap.toLocaleString('en-US')}. Check against the MRA website.</p>
    <button class="btn ghost" onclick="openRates()">Edit rates</button></div>
  <p class="note">ZeddWhy Interactive LTD · Interactive by Nature, Excellence by Choice</p>`;
}
function setName(v) { try { localStorage.setItem('zw_name', v.trim()); } catch (e) {} refreshAvatar(); }

/* ---------- auth ---------- */
function showLogin(msg) {
  $('#appView').style.display = 'none'; const l = $('#loginView'); l.style.display = 'block';
  l.innerHTML = `<div class="login"><img class="logo" src="${LOGO_FULL}" alt="ZeddWhy Interactive Ltd"><h1>Welcome back</h1><p>Sign in to your ZeddWhy account</p>
  <form onsubmit="signIn(event)">
    <div class="field">${ic('mail', 20)}<input name="email" type="email" placeholder="Email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></div>
    <div class="field">${ic('lock', 20)}<input name="password" type="password" placeholder="Password" autocomplete="current-password" autocapitalize="none" autocorrect="off" required></div>
    <label class="show"><input type="checkbox" onchange="this.form.password.type=this.checked?'text':'password'"> Show password</label>
    <button class="btn" id="loginBtn">Sign in</button><div class="err" id="loginErr">${esc(msg || '')}</div></form></div>`;
}
async function signIn(e) {
  e.preventDefault(); const f = new FormData(e.target), b = $('#loginBtn'); b.disabled = true;
  const { error } = await db.auth.signInWithPassword({ email: f.get('email').trim().toLowerCase(), password: f.get('password') });
  b.disabled = false;
  if (error) { $('#loginErr').textContent = error.message; return; }
  boot();
}
async function signOut() { await db.auth.signOut(); showLogin(); }
async function boot() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return showLogin();
  const { data, error } = await db.from('admins').select('user_id').eq('user_id', session.user.id);
  if (error || !data || !data.length) { await db.auth.signOut(); return showLogin('This account does not have access. Ask the other admin to add it.'); }
  S.user = session.user; $('#loginView').style.display = 'none'; $('#appView').style.display = 'block';
  buildNav(); go('dashboard');
}
boot();
</script>
